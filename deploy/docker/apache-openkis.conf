<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # OpenKIS: the framework writes its own .htaccess (mod_rewrite rules)
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve local configuration or VCS metadata
    <FilesMatch "^(openkis_config\.local\.php|config\.vars\.local\.php|\.openkis-image-version)$">
        Require all denied
    </FilesMatch>
    # table definitions of the data folder (the data itself is in MySQL)
    <DirectoryMatch "^/var/www/html/misc/fndatabase">
        Require all denied
    </DirectoryMatch>
    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>

    # Behind a reverse proxy (Traefik, Caddy, nginx) that terminates TLS
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
</VirtualHost>

ServerName localhost
ServerTokens Prod
ServerSignature Off
