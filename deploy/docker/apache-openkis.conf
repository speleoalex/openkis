<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # OpenKIS: the framework writes its own .htaccess (mod_rewrite rules)
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve local configuration or VCS metadata
    <FilesMatch "^(openkis_config\.local\.php|config\.vars\.local\.php|\.openkis-image-version)$">
        Require all denied
    </FilesMatch>
    # table definitions of the data folder (the data itself is in MySQL)
    <DirectoryMatch "^/var/www/html/misc/fndatabase">
        Require all denied
    </DirectoryMatch>
    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>

    # Unauthenticated maintenance/debug scripts: clear_cache.php deletes files
    # from a path given in the URL, openkis_las.php reads any *.las path or URL,
    # finis utils/tests are developer tools. Run them with php-cli instead.
    <LocationMatch "^/+(clear_cache|openkis_las)\.php">
        Require all denied
    </LocationMatch>
    <LocationMatch "^/+finis/+(utils|tests|examples)/">
        Require all denied
    </LocationMatch>
    # openkis_proxy.php (an open HTTP proxy) is allowed only when
    # OPENKIS_ENABLE_PROXY=1, see openkis-proxy.conf written by the entrypoint

    # Behind a reverse proxy (Traefik, Caddy, nginx) that terminates TLS
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
</VirtualHost>

ServerName localhost
ServerTokens Prod
ServerSignature Off
