<style>
    .openkis-report-table .r-ok { color: #1e7b34; }
    .openkis-report-table .r-warn { color: #8a5a00; }
    .openkis-report-table .r-bad { color: #b02a37; font-weight: bold; }
    [data-theme="dark"] .openkis-report-table .r-ok { color: #6fd08a; }
    [data-theme="dark"] .openkis-report-table .r-warn { color: #f0c060; }
    [data-theme="dark"] .openkis-report-table .r-bad { color: #ff8a93; }
    .openkis-report-table td, .openkis-report-table th { white-space: nowrap; vertical-align: top; }
    .openkis-report-table td:nth-child(2) { white-space: normal; min-width: 12em; }
    .openkis-report-table summary { cursor: pointer; }
    .openkis-report-table details ul { white-space: normal; min-width: 20em; max-width: 40em; margin: 4px 0; padding-left: 1.2em; font-size: 90%; }
    .openkis-report-table details p { white-space: normal; max-width: 40em; margin: 4px 0; }
    .openkis-report-table .openkis-ai-record { white-space: normal; min-width: 9em; }
    .openkis-report-actions .btn { min-height: 44px; margin: 0 4px 4px 0; }
</style>
<h3>{title}</h3>
<p>{count} schede &middot; dati del {generated_at}</p>
<div class="openkis-report-actions mb-3">
    <a href="{csvurl}" class="btn btn-primary">
        <i class="fa fa-download" aria-hidden="true"></i> Scarica Report CSV
    </a>
    <!-- if {canrefresh} -->
    <form method="post" action="{formurl}" style="display:inline" onsubmit="this.querySelector('button').disabled = true; this.querySelector('button').textContent = 'Aggiornamento in corso...';">
        <input type="hidden" name="op" value="refresh" />
        <input type="hidden" name="token" value="{token}" />
        <button type="submit" class="btn btn-secondary">Aggiorna</button>
    </form>
    <!-- end if {canrefresh} -->
</div>
<!-- if {table} -->
<div class="table-responsive">
    <table class="table table-hover table-sm openkis-report-table">
        <thead>
            <tr><!-- foreach {headers} --><th scope="col">{text}</th><!-- end foreach {headers} --></tr>
        </thead>
        <tbody>
<!-- foreach {rows} --><tr><!-- foreach {cols} --><td>{text}</td><!-- end foreach {cols} --></tr>
<!-- end foreach {rows} -->
        </tbody>
    </table>
</div>
<!-- end if {table} -->
