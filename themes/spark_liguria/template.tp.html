        <script>
            // Function to set minimum window size
            function setMinWindowSize() {
                // Get the current window width
                var windowWidth = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;

                // If the window width is less than 480px, resize it to 480px
                if (windowWidth < 300) {
                    window.resizeTo(300, window.innerHeight);
                }
            }

            // Call the function when the window is resized
            window.addEventListener('resize', setMinWindowSize);

            // Call the function on page load
            window.addEventListener('load', setMinWindowSize);

            // Pages with a full width map (caves list): the map starts right below the fixed navbar,
            // whose height changes with the window width. It only pulls the map up, never pushes it down.
            function openkisAlignMapToNavbar() {
                var map = document.querySelector('main.content > .openkis-map-full');
                var nav = document.querySelector('.navbar.fixed-top');
                if (!map || !nav) {
                    return;
                }
                map.style.marginTop = '0px';
                var top = map.getBoundingClientRect().top + window.pageYOffset;
                map.style.marginTop = Math.min(0, nav.offsetHeight - top) + 'px';
            }
            openkisAlignMapToNavbar();
            window.addEventListener('resize', openkisAlignMapToNavbar);
            window.addEventListener('load', openkisAlignMapToNavbar);
        </script>
